    .slice { stroke: var(--enf-color-neutral, #414A54); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .densfill { fill: var(--enf-fill-operator, #F7E4F8); stroke: none; }
    .dens { stroke: var(--enf-color-operator, #A32EAD); stroke-width: 2.4; fill: none; }
    .pt { fill: var(--enf-color-variable, #1D5B85); }
    .lbl { font: 14px 'Inter', system-ui, sans-serif; fill: var(--enf-color-neutral, #414A54);
            paint-order: stroke; stroke: var(--enf-bg, #FFFFFF); stroke-width: 4;
            stroke-linejoin: round; }
    .mlbl { font: italic 16px 'Charter', Georgia, serif; }
  </style>

