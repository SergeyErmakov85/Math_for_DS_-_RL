<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360"
     role="img" aria-labelledby="t d">
  <title id="t">Реализации случайного процесса и его сечение в фиксированный момент</title>
  <desc id="d">Пять траекторий выходят из общей точки слева и с ростом времени расходятся
    веером: разброс значений увеличивается. Вертикальная штриховая линия в момент t нуль
    пересекает все траектории, точки пересечения отмечены кружками. Справа от этой линии
    отложена колоколообразная кривая плотности распределения значений в сечении: она
    показывает, как распределены значения процесса поперёк ансамбля в один и тот же момент.
    Реализация читается вдоль оси времени, сечение — поперёк неё.</desc>

