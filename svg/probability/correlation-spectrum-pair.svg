<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330"
     role="img" aria-labelledby="t d">
  <title id="t">Корреляционная функция и спектральная плотность как пара преобразования Фурье</title>
  <desc id="d">Слева график корреляционной функции: острый максимум при нулевом сдвиге и
    экспоненциальный спад в обе стороны с изломом в вершине. Справа график спектральной
    плотности: колокол с максимумом на нулевой частоте, спадающий как обратный квадрат;
    штриховыми линиями отмечена полуширина, достигаемая на частоте, равной параметру
    затухания альфа. Панели соединены двусторонней стрелкой с подписью «преобразование
    Фурье»: чем быстрее спадает корреляция, тем шире спектр.</desc>

