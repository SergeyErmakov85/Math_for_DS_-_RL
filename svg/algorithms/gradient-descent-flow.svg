<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700"
     role="img" aria-labelledby="t d">
  <title id="t">Блок-схема градиентного спуска</title>
  <desc id="d">Алгоритм из пяти шагов. Начало: задать начальное приближение и скорость
    обучения. Далее в цикле: вычислить градиент функции потерь, сделать шаг против
    градиента, проверить критерий остановки. Если критерий не выполнен, управление
    возвращается к вычислению градиента; если выполнен — алгоритм завершается
    и возвращает найденную точку. Ветви условия подписаны «да» и «нет».</desc>

  <style>
    .term  { fill: var(--enf-fill-variable, #E3EDF4);
             stroke: var(--enf-color-variable, #1D5B85); stroke-width: 2.4; }
    .proc  { fill: var(--enf-fill-function, #F6EBDC);
             stroke: var(--enf-color-function, #8A5214); stroke-width: 2.4; }
    .dec   { fill: var(--enf-fill-target, #F7E2E8);
             stroke: var(--enf-color-target, #7A0A2C); stroke-width: 2.6; }
    .flow  { stroke: var(--enf-color-neutral, #414A54); stroke-width: 2.2; fill: none; }
    .back  { stroke: var(--enf-color-parameter, #3E7D3A); stroke-width: 2.2; fill: none;
             stroke-dasharray: 8 5; }
    .txt   { font: 15px 'Inter', system-ui, sans-serif; fill: var(--enf-fg, #1A1D21); }
    .mlbl  { font: italic 15px 'Charter', Georgia, serif; }
    .br    { font: 600 14px 'Inter', system-ui, sans-serif; }
  </style>

  <defs>
    <marker id="g-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--enf-color-neutral, #414A54)"/>
    </marker>
    <marker id="g-bk" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--enf-color-parameter, #3E7D3A)"/>
    </marker>
  </defs>

  <rect class="term" x="140" y="30" width="220" height="60" rx="30"/>
  <text class="txt" x="250" y="58" text-anchor="middle">Задать начальную точку</text>
  <text class="txt mlbl" x="250" y="78" text-anchor="middle">θ₀ и шаг α</text>

  <path class="flow" marker-end="url(#g-ar)" d="M 250 90 V 136"/>

  <rect class="proc" x="120" y="140" width="260" height="64" rx="8"/>
  <text class="txt" x="250" y="168" text-anchor="middle">Вычислить градиент</text>
  <text class="txt mlbl" x="250" y="190" text-anchor="middle">g = ∇L(θ)</text>

  <path class="flow" marker-end="url(#g-ar)" d="M 250 204 V 250"/>

  <rect class="proc" x="120" y="254" width="260" height="64" rx="8"/>
  <text class="txt" x="250" y="282" text-anchor="middle">Сделать шаг против градиента</text>
  <text class="txt mlbl" x="250" y="304" text-anchor="middle">θ ← θ − α·g</text>

  <path class="flow" marker-end="url(#g-ar)" d="M 250 318 V 364"/>

  <path class="dec" d="M 250 368 L 400 448 L 250 528 L 100 448 Z"/>
  <text class="txt" x="250" y="442" text-anchor="middle">Критерий</text>
  <text class="txt" x="250" y="462" text-anchor="middle">остановки?</text>

  <!-- нет: возврат к вычислению градиента -->
  <path class="back" marker-end="url(#g-bk)" d="M 100 448 H 50 V 172 H 116"/>
  <text class="br" x="62" y="308" text-anchor="middle"
        fill="var(--enf-color-parameter, #3E7D3A)">нет</text>

  <!-- да: выход -->
  <path class="flow" marker-end="url(#g-ar)" d="M 250 528 V 574"/>
  <text class="br" x="272" y="556" fill="var(--enf-color-neutral, #414A54)">да</text>

  <rect class="term" x="140" y="578" width="220" height="60" rx="30"/>
  <text class="txt" x="250" y="606" text-anchor="middle">Вернуть найденную точку</text>
  <text class="txt mlbl" x="250" y="626" text-anchor="middle">θ</text>

  <text class="txt" x="250" y="672" text-anchor="middle"
        fill="var(--enf-color-neutral, #414A54)" style="font-size:14px">
    Критерий остановки: ‖g‖ &lt; ε либо исчерпан лимит итераций
  </text>
</svg>
