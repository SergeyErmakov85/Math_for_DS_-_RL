# Сборка EPUB.

from: markdown+tex_math_dollars+pipe_tables+yaml_metadata_block+fenced_divs+bracketed_spans
to: epub3

metadata-files:
  - Build/metadata.yaml

filters:
  - Build/filters/enf-callouts.lua
  - Build/filters/enf-color.lua

css:
  - css/enf-tokens.css
  - css/enf-html.css

resource-path:
  - .
  - svg
  - Figures

standalone: true
toc: true
toc-depth: 3
epub-chapter-level: 2
html-math-method:
  method: mathml
