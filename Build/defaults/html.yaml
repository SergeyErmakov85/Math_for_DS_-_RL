# Сборка HTML: одна самодостаточная страница.
# Флаг --self-contained, а не --embed-resources: второй появился в Pandoc 3,
# а в целевом окружении установлен Pandoc 2.19 (см. docs/PROGRESS.md).

from: markdown+tex_math_dollars+pipe_tables+yaml_metadata_block+fenced_divs+bracketed_spans
to: html5

metadata-files:
  - Build/metadata.yaml

filters:
  - Build/filters/enf-callouts.lua
  - Build/filters/enf-color.lua

css:
  - Build/css/enf-tokens.css
  - Build/css/enf-html.css

include-in-header:
  - Build/templates/mathjax-macros.html

resource-path:
  - .
  - SVG
  - Figures

standalone: true
self-contained: true
toc: true
toc-depth: 3
html-math-method:
  method: mathjax
