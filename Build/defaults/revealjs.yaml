# Сборка презентации Reveal.js.
# Разделитель слайдов — заголовок второго уровня (slide-level: 2).

from: markdown+tex_math_dollars+pipe_tables+yaml_metadata_block+fenced_divs+bracketed_spans
to: revealjs

metadata-files:
  - Build/metadata.yaml

filters:
  - Build/filters/enf-callouts.lua
  - Build/filters/enf-color.lua

css:
  - Build/css/enf-tokens.css
  - Build/css/enf-html.css

include-in-header:
  - Build/templates/mathjax-macros.html

resource-path:
  - .
  - SVG
  - Figures

standalone: true
self-contained: true
slide-level: 2
html-math-method:
  method: mathjax

variables:
  revealjs-url: https://unpkg.com/reveal.js@4
  theme: white
  transition: none
