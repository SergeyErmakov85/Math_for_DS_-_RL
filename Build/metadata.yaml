# Общие метаданные сборки ENF.
# Подставляются во все форматы; отдельные форматы уточняют их в Build/defaults/.

lang: ru-RU
dir: ltr

# Шрифты здесь НЕ задаются намеренно.
#
# fontspec не подставляет замену: если названная гарнитура не установлена,
# сборка PDF падает с ошибкой «font cannot be found». Список желаемых шрифтов
# в конфигурации означал бы, что документ собирается только на машине автора.
#
# Поэтому Scripts/build.ps1 перебирает кандидатов, проверяет, какие из них
# фактически установлены, и передаёт первый найденный через --variable.
# Приоритеты кандидатов заданы там же.
fontsize: 11pt

# Полоса набора: строка 60–80 знаков (ENF-TYPO-002)
geometry:
  - a4paper
  - top=25mm
  - bottom=25mm
  - left=30mm
  - right=25mm

linestretch: 1.15
indent: false

# Оглавление: три уровня — глубже в оглавлении шум, а не навигация
toc: true
toc-depth: 3
numbersections: false

# Ссылки цветом из палитры, а не рамкой: рамка печатается и мешает
colorlinks: true
linkcolor: enfvariable
urlcolor: enfvariable
citecolor: enfoperator

# Подписи таблиц и рисунков
tableno: true

# Макросы ролей для MathJax подключаются отдельно, в defaults каждого
# HTML-подобного формата: Build/templates/mathjax-macros.html.
# Держать их здесь было бы соблазнительно, но метаданные попадают во все
# форматы сразу, а LaTeX-сборке этот блок не нужен и только мешает.
