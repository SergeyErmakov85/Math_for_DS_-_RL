<script>
/* Макросы ролей ENF для MathJax.
   Имена совпадают с макросами хранилища Obsidian
   (Obsidian/Vault/_meta/mathjax-preamble.md) и с командами LaTeX
   (Build/templates/enf-colors.tex) — один исходник собирается везде.

   Макрос вешает CSS-класс, а не фиксирует цвет: значение приходит из
   enf-tokens.css, поэтому формула перекрашивается вместе с темой
   страницы, а единый источник истины не нарушается (ENF-COLOR-001).

   Класс вешает \class{}{} из расширения html. Не \htmlClass: это макрос
   KaTeX, в MathJax он не определён и даёт «Undefined control sequence». */
window.MathJax = {
  tex: {
    macros: {
      enfVar: ['\\class{enf-variable}{#1}', 1],
      enfFun: ['\\class{enf-function}{#1}', 1],
      enfPar: ['\\class{enf-parameter}{#1}', 1],
      enfOp:  ['\\class{enf-operator}{#1}', 1],
      enfTgt: ['\\class{enf-target}{#1}', 1],
      enfNeu: ['\\class{enf-neutral}{#1}', 1]
    },
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  },
  options: { enableMenu: false }
};
</script>
